set -g default-terminal "tmux-256color"
set -s escape-time 0

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g status-style 'bg=#1e1e2e fg=#a6adc8'
set -g status-left-length 40
set -g status-right-length 0
set -g status-right ''

set -g status-left '#[fg=#a6adc8] #{=20:session_name} '

# Window name styling
set-window-option -g window-status-separator ' '
set-window-option -g window-status-format '#[fg=#313244]#[fg=#6c7086,bg=#313244]#I:#W#[fg=#313244,bg=#1e1e2e]'
set-window-option -g window-status-current-format '#[fg=#a6adc8]#[fg=#111111,bg=#a6adc8,bold]#I:#W#[fg=#a6adc8,bg=#1e1e2e]'

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind-key -r C-f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
bind-key -r M-h run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-t run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-n run-shell "tmux neww tmux-sessionizer -s 2"
